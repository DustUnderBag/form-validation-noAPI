<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
  </head>
  <body>
    <h1>Validate Form without Javascript API</h1>
    <form action="#" novalidate autocomplete="off">
      <div class="form-row">
        <label for="email">Email<span aria-label="label"> *</span></label>
        <input type="email" id="email" placeholder="abc@example.com" required />
        <span class="guide"></span>
      </div>

      <div class="form-row">
        <label for="country">Country</label>
        <select name="country" id="country" required>
          <option value="ca">Canada</option>
          <option value="fr">France</option>
          <option value="de">Germany</option>
          <option value="jp">Japan</option>
          <option value="uk">United Kingdom</option>
          <option value="us">United States</option>
        </select>
        <span class="guide"></span>
      </div>

      <div class="form-row">
        <label for="postal-code"
          >Postal Code<span aria-label="label"> *</span></label
        >
        <input type="text" id="postal-code" required />
        <span class="guide"></span>
      </div>

      <div class="form-row">
        <label for="pwd">Password<span aria-label="label"> *</span></label>
        <input type="password" name="pwd" id="pwd" required minlength="8" />
        <span class="guide"
          >Password should consist of characters, digits, and symbols.</span
        >
      </div>

      <div class="form-row">
        <label for="cfm-pwd"
          >Confirm Password<span aria-label="label"> *</span></label
        >
        <input
          type="password"
          name="cfmPwd"
          id="cfm-pwd"
          required
          minlength="8"
        />
        <span class="guide"></span>
      </div>

      <button type="submit" id="submit">Submit form</button>
    </form>
  </body>
</html>
